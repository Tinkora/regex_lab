[workspace]
members = ["crates/regex_lab_core", "crates/regex_lab_web"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/Tinkora/regex_lab"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
regex = "1.11"
wasm-bindgen = "0.2"
js-sys = "0.3"

[profile.release]
lto = "thin"
strip = true
